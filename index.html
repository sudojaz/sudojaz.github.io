<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jazlyn Jane A. Fajutrao — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ LANDING ============ -->
  <div id="landing">
    <div class="sky">
      <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
      <div class="cloud c4"></div><div class="cloud c5"></div>
    </div>
    <div class="laptop-stage" id="laptopStage">
      <button class="laptop" id="laptopBtn" aria-label="Open Jazlyn's portfolio">
        <div class="lid-wrap">
          <div class="screen">
            <div class="cam"></div>
            <div class="display"><span class="monogram">JJF</span></div>
          </div>
          <div class="lid">
            <div class="brand">
              <div class="mark">PORTFOLIO</div>
              <div class="name">Jazlyn Jane A. Fajutrao</div>
            </div>
          </div>
        </div>
        <div class="base"></div>
      </button>
    </div>
    <p class="hint">click the laptop to open</p>
  </div>

  <!-- ============ LOCKSCREEN ============ -->
  <div id="lockscreen">
    <div class="sky">
      <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
      <div class="cloud c4"></div><div class="cloud c5"></div>
    </div>
    <button class="lock-btn" id="lockBtn" aria-label="Unlock and view desktop">
      <div class="lock-avatar">JJF</div>
      <div class="lock-time" id="lockTime">—</div>
      <div class="lock-date" id="lockDate">—</div>
      <div class="lock-hint">🔒 click anywhere to unlock</div>
    </button>
  </div>

  <!-- ============ DESKTOP ============ -->
  <div id="desktop">
    <div class="sky">
      <div class="cloud c2"></div><div class="cloud c4"></div>
    </div>
    <div class="topbar">
      <div class="who"><span class="dot"></span> Jazlyn Jane A. Fajutrao</div>
      <div class="right">
        <span id="viewCount">Views: —</span>
        <span id="clock">—</span>
        <button class="shutdown-btn" id="shutdownBtn" aria-label="Shut down and return to landing page">⏻ Shut down</button>
      </div>
    </div>
    <div class="desktop-body" id="folderGrid"></div>
  </div>

  <!-- ============ WINDOW TEMPLATE ============ -->
  <div class="scrim" id="scrim">
    <div class="window" role="dialog" aria-modal="true" aria-labelledby="winTitle">
      <div class="window-head">
        <div class="title"><span class="swatch" id="winSwatch"></span><span id="winTitle"></span></div>
        <button class="window-close" id="winClose" aria-label="Close window">✕</button>
      </div>
      <div class="window-body" id="winBody"></div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
